name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-sonnet-5"
          prompt: |
            Revise o diff deste PR de um projeto Java/Spring Boot.
            Foque em: concorrência, vazamento de recursos, N+1 queries,
            segurança, e aderência aos padrões definidos no CLAUDE.md.
            Poste comentários inline nos pontos problemáticos.